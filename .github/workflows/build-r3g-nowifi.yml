name: Build FanchmWrt R3G (No WiFi)

# 仅手动触发：仓库页 Actions -> Build FanchmWrt R3G (No WiFi) -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/fanchmwrt/fanchmwrt.git
  SOURCE_BRANCH: fanchmwrt-25.12.6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get -y --no-install-recommends install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev libelf-dev \
            libzstd-dev liblzma-dev python3 python3-dev python3-setuptools \
            python3-distutils rsync swig unzip zlib1g-dev file wget time ccache

      - name: 克隆 FanchmWrt 源码
        run: |
          for i in 1 2 3; do
            rm -rf openwrt
            if git clone --depth 1 --branch "${SOURCE_BRANCH}" "${SOURCE_REPO}" openwrt; then
              break
            fi
            echo "克隆失败，第 ${i} 次重试..."
            sleep 15
          done
          test -d openwrt
          cd openwrt
          echo "源码分支：${SOURCE_BRANCH}"
          git log -1 --format='当前提交：%H %s'

      - name: 应用去 WiFi 补丁（移除驱动 + 禁用 PCIe）
        run: python3 scripts/trim-wifi.py openwrt

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then break; fi
            echo "feeds 更新失败，第 ${i} 次重试..."
            sleep 15
          done
          ./scripts/feeds install -a

      - name: 生成配置并校验
        run: |
          cp configs/r3g-nowifi.config openwrt/.config
          cd openwrt
          make defconfig
          echo "===== 目标设备 ====="
          grep -E '^CONFIG_TARGET_ramips(_mt7621)?=|^CONFIG_TARGET_ramips_mt7621_DEVICE' .config || true
          echo "===== 无线相关配置（预期驱动均为 not set）====="
          grep -E 'CONFIG_PACKAGE_(kmod-mt7603|kmod-mt76x2|kmod-mt76-core|wpad-basic-mbedtls|luci-app-fwx-wireless)=' .config || true
          if grep -qE '^CONFIG_PACKAGE_(kmod-mt7603|kmod-mt76x2)=y' .config; then
            echo "ERROR: 无线驱动仍被启用，停止编译（请检查补丁是否生效）"
            exit 1
          fi

      - name: 下载软件包源码
        run: |
          cd openwrt
          make -j"$(nproc)" download || make -j"$(nproc)" download

      - name: 编译固件
        shell: bash
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: 整理产物
        if: success()
        run: |
          mkdir -p out
          cp openwrt/bin/targets/ramips/mt7621/*.bin out/
          cp openwrt/bin/targets/ramips/mt7621/sha256sums out/ 2>/dev/null || true
          cp openwrt/bin/targets/ramips/mt7621/profiles.json out/ 2>/dev/null || true
          cp openwrt/.config out/build.config
          echo "===== 构建产物 ====="
          ls -lh out

      - name: 上传固件（Artifacts）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r3g-nowifi-firmware-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: 发布到 Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r3g-nowifi-${{ github.run_number }}
          name: "FanchmWrt R3G 无 WiFi 固件 #${{ github.run_number }}"
          body: |
            基于 fanchmwrt/fanchmwrt 分支 `fanchmwrt-25.12.6` 源码编译。

            - 设备：Xiaomi Mi Router 3G（非 v2，NAND 128MB）
            - 裁剪：移除 kmod-mt7603 / kmod-mt76x2 无线驱动，禁用 PCIe（两颗 WiFi 芯片不工作），不打包 wpad 与无线管理界面
            - 刷机：优先使用 `...squashfs-sysupgrade.bin`（不保留配置）
            - 校验：同目录 `sha256sums`
          files: out/*
          fail_on_unmatched_files: false

      - name: 上传失败日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: openwrt/build.log
          if-no-files-found: ignore
